name: Phase 3 regression

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/phase3-regression.yml"
  push:
    branches:
      - "main"
    paths:
      - "backend/**"
      - ".github/workflows/phase3-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: E3 and SA4 regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      MPLBACKEND: "Agg"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12.1
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.1"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements-test.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install \
            -r backend/requirements-test.lock.txt
          python -m pip check

      - name: Verify critical dependency versions
        run: |
          python - <<'PY'
          import networkx
          import pytest
          import sys

          print("python=" + sys.version.replace("\n", " "))
          print("networkx=" + networkx.__version__)
          print("pytest=" + pytest.__version__)

          assert networkx.__version__ == "3.3"
          assert pytest.__version__ == "9.1.1"
          PY

      - name: Compile critical Phase 3 modules
        run: |
          python -m py_compile \
            backend/harness/sensitivity_execution/execute_controlled_family.py \
            backend/harness/sensitivity_execution/run_timing_repetitions.py \
            backend/harness/sensitivity_execution/analyze_clustered_timing_precision.py \
            backend/harness/sensitivity_execution/analyze_clustered_timing_precision_v2.py \
            backend/harness/sensitivity_execution/tools/audit_membership_density_common_workload.py \
            backend/harness/sensitivity_execution/tools/objective_count_noise_operators_v2.py \
            backend/harness/sensitivity_execution/tools/prepare_objective_count_stage10_common_workloads_v2.py \
            backend/harness/sensitivity_execution/tools/audit_objective_count_structure_v2.py \
            backend/harness/sensitivity_execution/tools/audit_objective_count_stage10_common_workloads_v2.py \
            backend/harness/sensitivity_generator/objective_count_generator_v2.py \
            backend/harness/sensitivity_generator/families/objective_count_family_v2.py \
            backend/harness/sensitivity_generator/membership_density_generator.py \
            backend/harness/sensitivity_generator/families/membership_density_family.py \
            backend/harness/sensitivity_generator/oracles/membership_density_oracle.py

      - name: Validate E3 contract
        run: |
          python \
            backend/harness/sensitivity_execution/validate_e3_contract.py

      - name: Run E3 regression suite
        run: |
          python -m pytest \
            backend/harness/sensitivity_execution/tests \
            -q \
            -p no:cacheprovider

      - name: Run targeted SA4 regression suite
        run: |
          python -m pytest \
            backend/harness/sensitivity_generator/tests/test_membership_density_family.py \
            backend/harness/sensitivity_generator/tests/test_membership_density_generator.py \
            backend/harness/sensitivity_generator/tests/test_membership_density_oracle.py \
            backend/harness/sensitivity_execution/tests/test_membership_density_common_workload_auditor.py \
            backend/harness/sensitivity_execution/tests/test_membership_density_compatibility.py \
            -q \
            -p no:cacheprovider

      - name: Run targeted SA5 objective-count regression suite
        run: |
          python -m pytest \
            backend/harness/sensitivity_generator/tests/test_objective_count_generator_v2.py \
            backend/harness/sensitivity_generator/tests/test_objective_count_family_v2.py \
            backend/harness/sensitivity_execution/tests/test_objective_count_noise_operators_v2.py \
            backend/harness/sensitivity_execution/tests/test_objective_count_session_support_policy_v2.py \
            backend/harness/sensitivity_execution/tests/test_objective_count_structure_auditor_v2.py \
            backend/harness/sensitivity_execution/tests/test_objective_count_stage10_common_workloads_v2.py \
            -q \
            -p no:cacheprovider
