  levels: [25, 50, 75, 100]
  expected_instance_count: 40
  baseline_constraint_count: 4
  baseline_virtual_node_count: 24
  expected_partition_count: 10
  workload_steps_per_partition: 24
  additional_seeds_are_continuation: true
  alternative_seed_schedule: false
  canonical_campaign_generation_authorized: true
